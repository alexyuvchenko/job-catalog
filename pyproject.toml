[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-catalog"
version = "1.0.0"
description = "Search remote IT jobs in Ukraine that offer employee reservation (бронювання)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "certifi>=2024.8.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "playwright>=1.48.0",
    "uvicorn>=0.32",
]

[project.scripts]
job-catalog = "cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/jobs",
    "src/network",
    "src/sources",
    "src/storage",
    "src/web",
]
include = ["src/cli.py"]
sources = ["src"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
target-version = "py315"
line-length = 100
extend-exclude = [".venv"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter wraps code. HTML, CSS, SQL, and regex stay on one line.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "core", "jobs", "network", "sources", "storage", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
